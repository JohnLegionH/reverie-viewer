# Starts the released Linux x86_64 package on the newest Ubuntu release and the newest Ubuntu LTS, each in a fresh
# official Ubuntu container, with software graphics (Mesa's lavapipe) and a virtual display. It fetches the package
# from the release itself, so the file tested is the file people download, and checks its checksum first.
# Pass: the login screen draws on each Ubuntu and nothing crashes. The screenshot, the logs and a summary are kept as
# the run's artifacts.
name: Linux start check

on:
  push:
    branches: [linux-pkg-1]

permissions:
  contents: read

env:
  RELEASE_TAG: v0.1.1
  PACKAGE: reverie-viewer-0.1.1-linux-x86_64
  SUMS: reverie-viewer-0.1.1-SHA256SUMS.txt
  # the checksum of the package as it was built, so a file changed after the build is refused too
  PACKAGE_SHA256: "289de5489d98242e506e30ec0f65a6b458c015b66a03de7d3c819f47c4c360ca"

jobs:
  start:
    name: Start on Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # 26.10: the newest release; 26.04: the newest LTS
        ubuntu: ["26.10", "26.04"]
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the package from the release and check its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/work" "$RUNNER_TEMP/out"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/work" \
            --pattern "$PACKAGE.tar.gz" --pattern "$SUMS"
          grep "  $PACKAGE.tar.gz\$" "$RUNNER_TEMP/work/$SUMS" | sed "s#  #  $RUNNER_TEMP/work/#" | sha256sum -c -
          echo "$PACKAGE_SHA256  $RUNNER_TEMP/work/$PACKAGE.tar.gz" | sha256sum -c -

      - name: Start Reverie in ubuntu:${{ matrix.ubuntu }}
        run: |
          docker run --rm -e PACKAGE -v "$RUNNER_TEMP/work:/work" -v "$RUNNER_TEMP/out:/out" \
            -v "$GITHUB_WORKSPACE/.github/scripts:/scripts:ro" "ubuntu:${{ matrix.ubuntu }}" bash /scripts/linux-start-check.sh

      - name: Screenshot
        if: always()
        run: |
          test -f "$RUNNER_TEMP/out/screen.xwd" || { echo "no screenshot was taken"; exit 1; }
          python3 .github/scripts/xwd-to-png.py "$RUNNER_TEMP/out/screen.xwd" "$RUNNER_TEMP/out/screen-ubuntu-${{ matrix.ubuntu }}.png"

      - name: Summary
        if: always()
        run: cat "$RUNNER_TEMP/out/result.txt" >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: start-ubuntu-${{ matrix.ubuntu }}
          path: |
            ${{ runner.temp }}/out/
            !${{ runner.temp }}/out/screen.xwd
